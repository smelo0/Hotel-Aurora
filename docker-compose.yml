services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hotel
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./SQL/hotel.sql:/docker-entrypoint-initdb.d/01-hotel.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: hotel
      DB_PASS: hotel
      DB_NAME: hotel
      DB_PORT: 3306
      DB_TIMEOUT: 5
      APP_ENV: local
      APP_BASE_URL: http://localhost:8080
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
